name: V1 Real Article Test
on:
  push:
    branches: [test/v1-feed-integration]
    paths:
      - ".github/workflows/v1-real-article-test.yml"
  workflow_dispatch:
    inputs:
      article_id:
        description: "ID existente em data/news.json"
        required: true
        default: "nasa-swift-retoma-instrumento-burst-alert-27-09-2026"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/v1-feed-integration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python3 -m pip install --quiet pillow jsonschema
      - name: Build request from real article
        env:
          ARTICLE_ID: ${{ inputs.article_id || 'nasa-swift-retoma-instrumento-burst-alert-27-09-2026' }}
        run: |
          python3 - <<'PY'
          import json, os
          items=json.load(open("data/news.json",encoding="utf-8"))
          item=next(x for x in items if x.get("id")==os.environ["ARTICLE_ID"])
          req={k:item.get(k,"") for k in ("id","category","date","title","summary","credit")}
          req["imageCandidates"]=[item.get("sourceImage") or item.get("image")]
          json.dump(req,open("/tmp/request.json","w",encoding="utf-8"),ensure_ascii=False)
          PY
      - name: Render and validate
        run: |
          mkdir -p /tmp/out
          python3 scripts/build_news_art_v2.py --request-json /tmp/request.json --out-dir /tmp/out --output-json /tmp/result.json
          cat /tmp/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: v1-real-article-test
          path: |
            /tmp/out/*.jpg
            /tmp/result.json
          retention-days: 3
