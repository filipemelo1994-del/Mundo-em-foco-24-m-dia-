name: Claude Review
# Revisão opcional. Não participa da publicação via Windsor.ai.
on:
  workflow_dispatch:
    inputs:
      request_json:
        description: "Pedido completo conforme schemas/claude-review-request.v1.json"
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/v1-feed-integration
      - name: Validate review request
        env:
          PAYLOAD: ${{ inputs.request_json }}
        run: |
          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/request.json"
          python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$RUNNER_TEMP/request.json"
          echo "Pedido válido. Claude permanece consultivo e deve ser chamado pelo orquestrador externo quando configurado."
