name: Import News Entry
on:
  push:
    branches: [main]
    paths: ['requests/news/*.json']
permissions:
  contents: write
concurrency:
  group: mundo-em-foco-import-news
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
      - run: pip install --quiet requests pillow
      - name: Import entries and render branded art
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p public/news-art requests/news/failed
          for req in requests/news/*.json; do
            id=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8'))['id'])" "$req")
            python3 scripts/append_news_entry.py --entry "$req"
            set +e
            python3 scripts/build_news_art_v2.py --request-json "$req" --output-json "/tmp/result-$id.json"
            status=$?
            set -e

            # O V2 devolve:
            #   0 = arte gerada e validada
            #   2 = spec pendente/inválida
            #   3 = erro de renderização/mídia
            #   4 = arte gerada, mas reprovada pelo validador
            # Somente status 0 pode seguir para portal/publicação.
            if [ -f "/tmp/result-$id.json" ]; then
              python3 - "/tmp/result-$id.json" "/tmp/validation-$id.json" <<'PY'
          import json, sys
          src, dst = sys.argv[1], sys.argv[2]
          with open(src, encoding="utf-8") as f:
              result = json.load(f)
          validation = result.get("validation")
          if validation is not None:
              with open(dst, "w", encoding="utf-8") as f:
                  json.dump(validation, f, ensure_ascii=False, indent=2)
                  f.write("\n")
          PY
            fi

            if [ "$status" -eq 0 ] && [ -f "/tmp/result-$id.json" ]; then
              source_image=$(python3 -c "import json;print(json.load(open('/tmp/result-$id.json'))['sourceImage'])")
              out_path=$(python3 -c "import json;print(json.load(open('/tmp/result-$id.json'))['path'])")
              art_sha256=$(python3 -c "import json;print(json.load(open('/tmp/result-$id.json'))['sha256'])")
              url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${out_path}"
              python3 scripts/update_news_entry.py --file data/news.json --id "$id" --source-image "$source_image" --instagram-image "$url"
              if [ -f "/tmp/validation-$id.json" ]; then
                python3 scripts/update_publish_queue.py --id "$id" --art-sha256 "$art_sha256" --art-validation "/tmp/validation-$id.json"
              else
                python3 scripts/update_publish_queue.py --id "$id" --art-sha256 "$art_sha256"
              fi
              rm -f "$req"
            else
              echo "::warning::Falha ao gerar/validar arte de $id (build_news_art_v2 exit=$status)"
              if [ -f "/tmp/result-$id.json" ]; then
                art_sha256=$(python3 -c "import json;print(json.load(open('/tmp/result-$id.json')).get('sha256',''))")
                args=(--id "$id" --error "build_news_art_v2 exit=$status")
                if [ -n "$art_sha256" ]; then args+=(--art-sha256 "$art_sha256"); fi
                if [ -f "/tmp/validation-$id.json" ]; then args+=(--art-validation "/tmp/validation-$id.json"); fi
                python3 scripts/update_publish_queue.py "${args[@]}"
              else
                python3 scripts/update_publish_queue.py --id "$id" --error "build_news_art_v2 exit=$status"
              fi
              mv "$req" "requests/news/failed/$(basename "$req")"
            fi
          done
          python3 scripts/update_publish_queue.py --sync-news
      - name: Commit portal and final art
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/news.json data/publish-queue.json public/news-art requests/news
          if ! git diff --cached --quiet; then
            git commit -m 'chore: publish Mundo em Foco 24 portal and branded art'
            # Outros workflows também escrevem em main. Sincroniza antes do push
            # para evitar rejeição non-fast-forward quando duas filas terminam juntas.
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "::warning::Conflito de publicação; nova tentativa $attempt/3"
              sleep $((attempt * 3))
            done
            echo "::error::Não foi possível publicar após 3 tentativas."
            exit 1
          fi
