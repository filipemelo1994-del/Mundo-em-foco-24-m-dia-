name: Auto Publish Instagram Every Hour
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mundo-em-foco-auto-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select newest validated unpublished item only
        id: select
        shell: bash
        run: |
          ID=$(python3 - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          with open("data/news.json",encoding="utf-8") as f: news=json.load(f)
          with open("data/publish-queue.json",encoding="utf-8") as f: q=json.load(f)
          byid={n.get("id"):n for n in news}
          now=datetime.now(timezone.utc)
          candidates=[]
          for nid,item in (q.get("items") or {}).items():
              n=byid.get(nid)
              if not n: continue
              if item.get("state")!="FEED_PENDENTE" or item.get("feed_media_id"): continue
              if not item.get("portal") or not item.get("feed_art"): continue
              image=(n.get("instagramImage") or "").strip()
              expected=f"https://raw.githubusercontent.com/filipemelo1994-del/Mundo-em-foco-24-m-dia-/main/public/news-art/{nid}.jpg"
              if image != expected: continue
              validation=(json.load(open("data/public-validation/latest.json",encoding="utf-8")).get(nid) or {})
              if validation.get("passed") is not True or not validation.get("sha256"): continue
              published=str(n.get("published") or "")
              if not published: continue
              try:
                  created=datetime.fromisoformat(published.replace("Z","+00:00"))
                  if created.tzinfo is None: created=created.replace(tzinfo=timezone.utc)
                  else: created=created.astimezone(timezone.utc)
              except ValueError:
                  continue
              # Somente pautas realmente recentes: não publicar fila antiga nem duplicar matérias.
              age=(now-created).total_seconds()
              if age < -300 or age > 7200: continue
              candidates.append((created.timestamp(), str(nid)))
          candidates.sort(reverse=True)
          print(candidates[0][1] if candidates else "")
          PY
          )
          echo "news_id=$ID" >> "$GITHUB_OUTPUT"
          [ -n "$ID" ] && echo "Selecionada: $ID" || echo "Nenhuma pauta nova elegível; nada será publicado."
      - name: Publish exactly selected item
        if: ${{ steps.select.outputs.news_id != '' }}
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: '17841436453506787'
          PUBLISH_NEWS_ID: ${{ steps.select.outputs.news_id }}
        run: python3 scripts/auto_publish_windsor.py
      - name: Commit media_id confirmation
        if: ${{ steps.select.outputs.news_id != '' && !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/publish-queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: confirma publicação automática no Instagram'
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi
