name: Auto Publish Instagram Every 30 Minutes
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mundo-em-foco-auto-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select newest validated unpublished item only
        id: select
        shell: bash
        run: |
          ID=$(python3 - <<'PY'
          import json
          import re
          from datetime import date, datetime
          with open("data/news.json",encoding="utf-8") as f: news=json.load(f)
          with open("data/publish-queue.json",encoding="utf-8") as f: q=json.load(f)
          byid={n.get("id"):n for n in news}
          cutoff=date(2026, 9, 27)
          candidates=[]
          for nid,item in (q.get("items") or {}).items():
              n=byid.get(nid)
              if not n: continue
              if item.get("state")!="FEED_PENDENTE" or item.get("feed_media_id"): continue
              if not item.get("portal") or not item.get("feed_art"): continue
              image=(n.get("instagramImage") or "").strip()
              if not image.startswith("https://raw.githubusercontent.com/"): continue
              published=str(n.get("published") or "")
              story_date=None
              if published:
                  try: story_date=datetime.strptime(published[:10], "%Y-%m-%d").date()
                  except ValueError: pass
              if story_date is None:
                  match=re.search(r"-(\d{2})-(\d{2})-(\d{4})$", str(nid))
                  if match:
                      try: story_date=datetime.strptime("-".join(match.groups()), "%d-%m-%Y").date()
                      except ValueError: pass
              # Evita drenar pautas antigas, mas aceita qualquer data de pauta a partir de 27/09/2026.
              if story_date is None or story_date < cutoff: continue
              candidates.append((story_date.isoformat(), published, str(nid)))
          candidates.sort(reverse=True)
          print(candidates[0][2] if candidates else "")
          PY
          )
          echo "news_id=$ID" >> "$GITHUB_OUTPUT"
          [ -n "$ID" ] && echo "Selecionada: $ID" || echo "Nenhuma pauta nova elegível; nada será publicado."
      - name: Publish exactly selected item
        if: ${{ steps.select.outputs.news_id != '' }}
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: '17841436453506787'
          PUBLISH_NEWS_ID: ${{ steps.select.outputs.news_id }}
        run: python3 scripts/auto_publish_windsor.py
      - name: Commit media_id confirmation
        if: ${{ steps.select.outputs.news_id != '' && !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/publish-queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: confirma publicação automática no Instagram'
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin main; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            exit 1
          fi
