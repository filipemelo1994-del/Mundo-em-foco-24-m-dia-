name: Import News Image
on:
  push:
    branches: [main]
    paths:
      - "requests/**.json"
permissions:
  contents: write
concurrency:
  group: import-news-image
  cancel-in-progress: false
jobs:
  import-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests pillow
      - name: Process requests
        run: |
          python3 << 'PYEOF'
          import json,re,sys
          from io import BytesIO
          from pathlib import Path
          import requests
          from PIL import Image,ImageOps
          reqs=sorted(Path("requests").glob("*.json"))
          if not reqs: sys.exit(0)
          outdir=Path("assets/noticias"); outdir.mkdir(parents=True,exist_ok=True)
          for req in reqs:
              data=json.loads(req.read_text(encoding="utf-8"))
              url=str(data.get("image_url","")).strip()
              name=str(data.get("filename","")).strip()
              if not url or not name: raise SystemExit("image_url/filename required")
              name=re.sub(r"\.[A-Za-z0-9]+$","",name)
              name=re.sub(r"[^A-Za-z0-9_-]","-",name).strip("-")
              if not name: raise SystemExit("invalid filename")
              r=requests.get(url,timeout=45,allow_redirects=True,headers={"User-Agent":"MundoEmFoco24-ImageImporter/1.0"})
              r.raise_for_status()
              try:
                  p=Image.open(BytesIO(r.content)); p.verify()
              except Exception as e: raise SystemExit("invalid image: "+str(e))
              img=Image.open(BytesIO(r.content)); img.load(); img=ImageOps.exif_transpose(img)
              if img.mode in ("RGBA","LA") or (img.mode=="P" and "transparency" in img.info):
                  rgba=img.convert("RGBA"); bg=Image.new("RGB",rgba.size,(255,255,255)); bg.paste(rgba,mask=rgba.getchannel("A")); img=bg
              else: img=img.convert("RGB")
              img.save(outdir/(name+".jpg"),"JPEG",quality=85,optimize=True,progressive=True,exif=b"")
              req.unlink()
          PYEOF
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/noticias requests || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: import requested news images"
          git push origin main
