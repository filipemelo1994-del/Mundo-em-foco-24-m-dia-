name: Import News Image

on:
  push:
    branches: [main]
    paths:
      - "requests/*.json"
      - "requests/**/*.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests pillow

      - name: Process pending image requests
        id: process
        run: |
          python3 << 'PYEOF'
          import glob, json, os, re, sys, requests
          from io import BytesIO
          from PIL import Image
          request_files=sorted(glob.glob("requests/*.json"))
          if not request_files:
              print("No request files found — nothing to do.")
              sys.exit(0)
          allowed_types={"image/jpeg","image/jpg","image/png","image/webp"}
          processed=[]; skipped=[]
          for req_path in request_files:
              try:
                  with open(req_path,"r",encoding="utf-8") as f: payload=json.load(f)
              except Exception as e:
                  skipped.append((req_path,f"invalid JSON: {e}")); continue
              image_url=payload.get("image_url"); raw_filename=payload.get("filename")
              if not image_url or not raw_filename:
                  skipped.append((req_path,"missing image_url or filename")); continue
              filename=re.sub(r"\.[a-zA-Z0-9]+$","",raw_filename)
              filename=re.sub(r"[^a-zA-Z0-9_-]","-",filename).strip("-")
              if not filename:
                  skipped.append((req_path,"invalid filename after sanitization")); continue
              try:
                  resp=requests.get(image_url,timeout=30); resp.raise_for_status()
              except Exception as e:
                  skipped.append((req_path,f"download failed: {e}")); continue
              content_type=resp.headers.get("Content-Type","").split(";")[0].strip().lower()
              if content_type not in allowed_types:
                  try:
                      probe=Image.open(BytesIO(resp.content)); probe.verify()
                      content_type=f"image/{probe.format.lower()}"
                  except Exception:
                      skipped.append((req_path,f"unsupported or invalid image type: {content_type}")); continue
                  if content_type not in allowed_types:
                      skipped.append((req_path,f"unsupported MIME type: {content_type}")); continue
              try:
                  img=Image.open(BytesIO(resp.content)); img.load()
                  if img.mode in ("RGBA","LA","P"):
                      background=Image.new("RGB",img.size,(255,255,255))
                      rgba=img.convert("RGBA"); background.paste(rgba,mask=rgba.split()[-1]); img=background
                  elif img.mode!="RGB": img=img.convert("RGB")
                  out_dir="assets/noticias"; os.makedirs(out_dir,exist_ok=True)
                  out_path=os.path.join(out_dir,f"{filename}.jpg")
                  img.save(out_path,"JPEG",quality=85,optimize=True,progressive=True)
                  processed.append((req_path,out_path,f"{filename}.jpg"))
              except Exception as e:
                  skipped.append((req_path,f"processing failed: {e}")); continue
          removed=[]
          for req_path,_reason in skipped:
              os.remove(req_path); removed.append(req_path)
          for req_path,_out_path,_fname in processed:
              os.remove(req_path); removed.append(req_path)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"has_changes={'true' if (processed or removed) else 'false'}\n")
              f.write("processed_filenames<<EOF\n")
              for _req,_out,fname in processed: f.write(fname+"\n")
              f.write("EOF\n")
          if skipped:
              print("Skipped requests:")
              for req_path,reason in skipped: print(f" - {req_path}: {reason}")
          PYEOF

      - name: Commit and push
        if: steps.process.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/noticias requests
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: import news image(s) from requests queue"
            git push origin main
          fi

      - name: Output public URLs
        if: steps.process.outputs.has_changes == 'true'
        run: |
          REPO="${{ github.repository }}"
          echo "### Public URLs" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r FNAME; do
            [ -z "$FNAME" ] && continue
            RAW_URL="https://raw.githubusercontent.com/${REPO}/main/assets/noticias/${FNAME}"
            echo "- $RAW_URL" >> "$GITHUB_STEP_SUMMARY"
          done <<< "${{ steps.process.outputs.processed_filenames }}"
