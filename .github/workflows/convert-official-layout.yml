name: Convert Official Layout to JPEG
on:
  push:
    paths:
      - 'requests/convert-layout.txt'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Convert exact official layout
        run: |
          python - <<'PY'
          from PIL import Image
          src='assets/templates/layout-oficial-mundo-em-foco24.webp'
          dst='assets/templates/layout-oficial-mundo-em-foco24.jpg'
          im=Image.open(src).convert('RGB')
          im.save(dst,'JPEG',quality=96,subsampling=0,optimize=True)
          print(im.size, dst)
          PY
      - name: Commit JPEG
        run: |
          rm -f requests/convert-layout.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/templates/layout-oficial-mundo-em-foco24.jpg requests/convert-layout.txt
          git commit -m "brand: gera JPEG compatível do layout oficial" || exit 0
          git push
