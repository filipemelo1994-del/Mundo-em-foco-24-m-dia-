name: Test Auto Publisher
on:
  pull_request:
    paths:
      - 'scripts/auto_publish_windsor.py'
      - 'tests/test_auto_publish_windsor.py'
      - '.github/workflows/auto-publish-instagram-hourly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest -v tests/test_auto_publish_windsor.py
